name: Build

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@v5

      - name: Set Up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify Consumer BOM
        run: |
          test -s forwardmeasure-jpa-bom/.flattened-pom.xml
          grep -q '<dependencyManagement>' \
            forwardmeasure-jpa-bom/.flattened-pom.xml
          grep -q '<artifactId>forwardmeasure-jpa-core</artifactId>' \
            forwardmeasure-jpa-bom/.flattened-pom.xml
          grep -q '<artifactId>forwardmeasure-jpa-quarkus</artifactId>' \
            forwardmeasure-jpa-bom/.flattened-pom.xml
